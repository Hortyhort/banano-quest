<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </radialGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#01579B" stroke-width="8"/>
  <!-- Monkey body -->
  <ellipse cx="256" cy="320" rx="100" ry="120" fill="#795548"/>
  <!-- Monkey head -->
  <circle cx="256" cy="200" r="100" fill="#8D6E63"/>
  <!-- Face -->
  <ellipse cx="256" cy="220" rx="70" ry="60" fill="url(#face)"/>
  <!-- Eyes -->
  <circle cx="228" cy="190" r="18" fill="white"/>
  <circle cx="284" cy="190" r="18" fill="white"/>
  <circle cx="232" cy="192" r="10" fill="#3E2723"/>
  <circle cx="288" cy="192" r="10" fill="#3E2723"/>
  <circle cx="234" cy="189" r="4" fill="white"/>
  <circle cx="290" cy="189" r="4" fill="white"/>
  <!-- Nose -->
  <ellipse cx="256" cy="218" rx="12" ry="8" fill="#5D4037"/>
  <!-- Mouth -->
  <path d="M240 240 Q256 258 272 240" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round"/>
  <!-- Ears -->
  <circle cx="160" cy="190" r="30" fill="#8D6E63"/>
  <circle cx="160" cy="190" r="18" fill="#FFAB91"/>
  <circle cx="352" cy="190" r="30" fill="#8D6E63"/>
  <circle cx="352" cy="190" r="18" fill="#FFAB91"/>
  <!-- Coin -->
  <circle cx="380" cy="380" r="60" fill="#FFD600"/>
  <circle cx="380" cy="380" r="60" fill="none" stroke="#FF8F00" stroke-width="5"/>
  <circle cx="380" cy="380" r="48" fill="none" stroke="#FFA000" stroke-width="2"/>
  <text x="380" y="400" text-anchor="middle" font-family="Arial Black" font-size="48" fill="#FF8F00" font-weight="bold">B</text>
</svg>
